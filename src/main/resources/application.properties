spring.application.name=llm-chatbot
server.port=8081

# OpenRouter provides an OpenAI-compatible chat completions API.
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}

# Serve the plain frontend folder from the project root.
spring.web.resources.static-locations=file:./frontend/,classpath:/static/
